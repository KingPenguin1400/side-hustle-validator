<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Hustle Validator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Side Hustle <span class="accent">Validator</span></h1>
            <p>Turn your "what if" into a "how much".</p>
        </header>

        <!-- Intake Form -->
        <main id="main-content">
            <section id="form-card" class="card">
                <h2>The Blueprint</h2>
                <form id="intake-form">
                    <div class="form-group">
                        <label>What are you building? (Product)</label>
                        <input type="text" id="product" placeholder="e.g. A subscription box for rare succulents" required>
                    </div>
                    <div class="form-group">
                        <label>Who is it for? (Audience)</label>
                        <input type="text" id="audience" placeholder="e.g. Urban apartment dwellers, 25-40" required>
                    </div>
                    <div class="form-group">
                        <label>What's the pain? (Problem)</label>
                        <textarea id="problem" placeholder="Describe the frustration..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>What do they use now? (Alternatives)</label>
                        <input type="text" id="alternatives" placeholder="e.g. Buying from local nurseries, nothing">
                    </div>
                    <div class="form-group">
                        <label>Price Point ($)</label>
                        <input type="number" id="price" placeholder="e.g. 49.99" required>
                    </div>
                    <div class="form-group">
                        <label>Cost per Sale ($)</label>
                        <input type="number" id="cost_per_sale" placeholder="e.g. 15.00" required>
                    </div>
                    <div class="form-group">
                        <label>Where will you find them? (Channels)</label>
                        <input type="text" id="channels" placeholder="e.g. Instagram Ads, TikTok, SEO">
                    </div>
                    <button type="submit" class="btn-primary">Validate My Idea</button>
                </form>
            </section>

            <!-- Results Section (Hidden by default) -->
            <section id="results-card" class="card hidden">
                <div class="results-header">
                    <h2 id="display-product">Result</h2>
                    <div id="verdict-badge" class="badge"></div>
                </div>

                <div class="grid-layout">
                    <div class="scores-col">
                        <h3>Core Metrics</h3>
                        <div id="score-bars"></div>
                        
                        <div class="callouts">
                            <div id="green-flags" class="flag green"></div>
                            <div id="red-flags" class="flag red"></div>
                        </div>
                    </div>

                    <div class="stats-col">
                        <div class="card sub-card">
                            <h3>Profitability</h3>
                            <p class="big-stat" id="profit-calc">$0.00</p>
                            <small>Per unit sold</small>
                        </div>

                        <div class="card sub-card">
                            <h3>Action Plan</h3>
                            <p><strong>One thing to fix:</strong></p>
                            <p id="fix-highlight" class="highlight"></p>
                        </div>
                    </div>
                </div>

                <div class="sprint-section">
                    <h3>7-Day Launch Sprint</h3>
                    <p>Current Streak: <span id="streak-count">0</span> days</p>
                    <div id="checklist">
                        <!-- Generated by JS -->
                    </div>
                    <button id="complete-day-btn" class="btn-accent">Complete Day</button>
                </div>

                <button onclick="window.location.reload()" class="btn-secondary">Restart Analysis</button>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
